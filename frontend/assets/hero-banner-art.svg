<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12513f"/>
      <stop offset="100%" stop-color="#0a3527"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c8a68"/>
      <stop offset="100%" stop-color="#0b3f30"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2f2c"/>
      <stop offset="100%" stop-color="#141715"/>
    </linearGradient>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2f2c"/>
      <stop offset="100%" stop-color="#0f1210"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ddc8"/>
      <stop offset="100%" stop-color="#cfc0a0"/>
    </linearGradient>
    <radialGradient id="pedestalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Pedestal -->
  <ellipse cx="320" cy="560" rx="230" ry="34" fill="url(#pedestalGrad)"/>
  <ellipse cx="320" cy="556" rx="200" ry="16" fill="#ffffff" opacity="0.08"/>

  <!-- Confetti / sparkle accents -->
  <g fill="#e3bd44">
    <rect x="70" y="120" width="10" height="10" transform="rotate(45 75 125)" opacity="0.85"/>
    <rect x="540" y="90" width="8" height="8" transform="rotate(45 544 94)" opacity="0.7"/>
    <rect x="500" y="200" width="7" height="7" transform="rotate(45 503 203)" opacity="0.6"/>
    <circle cx="100" cy="200" r="4" opacity="0.7"/>
    <circle cx="560" cy="300" r="5" opacity="0.6"/>
    <circle cx="90" cy="420" r="4" opacity="0.5"/>
  </g>
  <!-- motion swoosh lines (bottom-left, echoing the reference art) -->
  <g stroke="#e3bd44" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="40" y1="470" x2="140" y2="470"/>
    <line x1="55" y1="490" x2="160" y2="490"/>
    <line x1="70" y1="510" x2="150" y2="510"/>
  </g>

  <!-- Shopping bag -->
  <g filter="url(#softShadow)">
    <path d="M 380 260 Q 380 200 420 200 Q 460 200 460 260" fill="none" stroke="#0a3527" stroke-width="10"/>
    <rect x="350" y="260" width="140" height="180" rx="10" fill="url(#bagGrad)"/>
    <rect x="350" y="260" width="140" height="30" rx="8" fill="#0a3527"/>
    <!-- V logo mark on bag -->
    <g transform="translate(392, 305)">
      <path d="M0 0 L18 55 L36 0 L26 0 L18 34 L10 0 Z" fill="#e3bd44"/>
      <circle cx="10" cy="62" r="3" fill="#e3bd44"/>
      <circle cx="26" cy="62" r="3" fill="#e3bd44"/>
    </g>
  </g>

  <!-- Headphones (resting against the bag, right side) -->
  <g filter="url(#softShadow)" transform="translate(470, 300)">
    <path d="M 10 60 A 60 60 0 0 1 130 60" fill="none" stroke="url(#headGrad)" stroke-width="14" stroke-linecap="round"/>
    <rect x="-6" y="50" width="34" height="54" rx="16" fill="url(#headGrad)"/>
    <rect x="102" y="50" width="34" height="54" rx="16" fill="url(#headGrad)"/>
  </g>

  <!-- Phone mockup (front and center-left) -->
  <g filter="url(#softShadow)" transform="translate(190, 190)">
    <rect x="0" y="0" width="150" height="300" rx="26" fill="url(#phoneGrad)"/>
    <rect x="8" y="8" width="134" height="284" rx="20" fill="url(#screenGrad)"/>
    <rect x="55" y="16" width="40" height="8" rx="4" fill="#0a3527"/>
    <text x="75" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700">10:30</text>
    <text x="75" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cfe9dd">MON, 01 JUL</text>
    <rect x="30" y="230" width="90" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="30" y="248" width="60" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Smartwatch (front, left of phone) -->
  <g filter="url(#softShadow)" transform="translate(120, 380)">
    <rect x="-10" y="30" width="30" height="70" rx="10" fill="#0a3527"/>
    <rect x="60" y="30" width="30" height="70" rx="10" fill="#0a3527"/>
    <rect x="0" y="20" width="70" height="90" rx="18" fill="url(#watchGrad)"/>
    <rect x="8" y="30" width="54" height="70" rx="12" fill="url(#screenGrad)"/>
    <text x="35" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="600">10:30</text>
  </g>
</svg>
